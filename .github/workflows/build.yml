name: Build and Release (Windows Only)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-x64:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Prepare Python backend
      run: npm run prepare-backend
    
    - name: Verify binaries exist
      run: |
        if (!(Test-Path "extraResources/ollama/win32-x64/ollama.exe")) {
          Write-Error "Ollama x64 binary not found!"
          exit 1
        }
        if (!(Test-Path "extraResources/tesseract/win32-x64/tesseract.exe")) {
          Write-Error "Tesseract x64 binary not found!"
          exit 1
        }
        Write-Host "All x64 binaries verified ✓"
      shell: pwsh
    
    - name: Build application (x64)
      run: npm run make -- --arch=x64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-installer
        path: out/make/squirrel.windows/**/*.exe

  build-windows-arm64:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      # This checks out the repo with all pre-bundled binaries already in place
      # The binaries in extraResources/*/win32-arm64/ are committed to git
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Prepare Python backend
      run: npm run prepare-backend
    
    - name: Verify binaries exist
      run: |
        # Verify that pre-bundled binaries are present in the repo
        # These binaries are already committed to git, not downloaded during CI
        if (!(Test-Path "extraResources/ollama/win32-arm64/ollama.exe")) {
          Write-Error "Ollama ARM64 binary not found!"
          exit 1
        }
        if (!(Test-Path "extraResources/tesseract/win32-arm64/tesseract.exe")) {
          Write-Error "Tesseract ARM64 binary not found!"
          exit 1
        }
        Write-Host "All ARM64 binaries verified"
      shell: pwsh
    
    - name: Build application (ARM64)
      run: npm run make -- --arch=arm64
      # This packages the app for ARM64 and includes all binaries from win32-arm64 folders
      # Note: Tesseract and Poppler are x64 binaries that will run via Windows emulation
      # Windows 11 ARM64 has built-in x64 emulation - no special setup needed!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-arm64-installer
        path: out/make/squirrel.windows/**/*.exe

  release:
    needs: [build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          windows-x64-installer/**/*.exe
          windows-arm64-installer/**/*.exe
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
