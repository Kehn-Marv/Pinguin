name: Build and Release (Windows Only)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-x64:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Bundle Python runtime (x64)
      run: npm run bundle-python -- --arch=x64
    
    - name: Prepare Python backend
      run: npm run prepare-backend
    
    - name: Verify binaries exist
      run: |
        if (!(Test-Path "extraResources/ollama/win32-x64/ollama.exe")) {
          Write-Error "Ollama x64 binary not found!"
          exit 1
        }
        if (!(Test-Path "extraResources/tesseract/win32-x64/tesseract.exe")) {
          Write-Error "Tesseract x64 binary not found!"
          exit 1
        }
        if (!(Test-Path "python-runtime/win32-x64/python.exe")) {
          Write-Error "Python x64 runtime not found!"
          exit 1
        }
        Write-Host "All x64 binaries verified ✓"
      shell: pwsh
    
    - name: Build application (x64)
      run: npm run make -- --arch=x64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-installer
        path: out/make/squirrel.windows/**/*.exe

  build-windows-arm64:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Bundle Python runtime (ARM64 using x64 Python)
      run: npm run bundle-python -- --arch=arm64
    
    - name: Prepare Python backend
      run: npm run prepare-backend
    
    - name: Verify binaries exist
      run: |
        if (!(Test-Path "extraResources/ollama/win32-arm64/ollama.exe")) {
          Write-Error "Ollama ARM64 binary not found!"
          exit 1
        }
        if (!(Test-Path "extraResources/tesseract/win32-arm64/tesseract.exe")) {
          Write-Error "Tesseract ARM64 binary not found!"
          exit 1
        }
        if (!(Test-Path "python-runtime/win32-arm64/python.exe")) {
          Write-Error "Python ARM64 runtime not found!"
          exit 1
        }
        Write-Host "All ARM64 binaries verified ✓"
      shell: pwsh
    
    - name: Build application (ARM64)
      run: npm run make -- --arch=arm64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-arm64-installer
        path: out/make/squirrel.windows/**/*.exe

  release:
    needs: [build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        files: |
          windows-x64-installer/**/*.exe
          windows-arm64-installer/**/*.exe
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
